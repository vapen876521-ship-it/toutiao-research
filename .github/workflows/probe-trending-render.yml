name: Probe rendered trending and article structure

on:
  push:
    paths:
      - 'probe_trending_render.py'
      - '.github/workflows/probe-trending-render.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python probe_trending_render.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trending-render-probe
          path: output_trending_render/
          retention-days: 7
