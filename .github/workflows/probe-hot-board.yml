name: Probe Toutiao hot board and trending pages

on:
  workflow_dispatch:
  push:
    paths:
      - 'probe_hot_board.py'
      - '.github/workflows/probe-hot-board.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python probe_hot_board.py
      - uses: actions/upload-artifact@v4
        with:
          name: hot-board-probe
          path: |
            hot_board.json
            hot_trending_report.json
            hot_native_posts.csv
          retention-days: 7
