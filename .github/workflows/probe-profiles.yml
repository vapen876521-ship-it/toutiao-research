name: Probe Toutiao public profiles

on:
  workflow_dispatch:
  push:
    paths:
      - 'probe_profiles.py'
      - 'requirements.txt'
      - '.github/workflows/probe-profiles.yml'

jobs:
  probe-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Probe public profiles
        run: python probe_profiles.py
      - name: Upload profile probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toutiao-profile-probe
          path: output_profiles/
          retention-days: 7
