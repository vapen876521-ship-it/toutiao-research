name: Probe native source provenance

on:
  workflow_dispatch:
  push:
    paths:
      - 'probe_native_source.py'
      - '.github/workflows/probe-native-source.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python probe_native_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-source-probe
          path: native_source_probe.json
          retention-days: 7
