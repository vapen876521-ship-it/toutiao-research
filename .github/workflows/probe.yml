name: Toutiao public-access probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'probe.py'
      - 'requirements.txt'
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Probe public Toutiao pages
        run: python probe.py
      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toutiao-probe-output
          path: output/
          if-no-files-found: warn
          retention-days: 7
