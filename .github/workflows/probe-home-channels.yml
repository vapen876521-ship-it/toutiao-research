name: Probe public home channels
on:
  push:
    paths:
      - 'probe_home_channels.py'
      - '.github/workflows/probe-home-channels.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python probe_home_channels.py
      - uses: actions/upload-artifact@v4
        with:
          name: home-channel-probe
          path: home_channel_probe/
          retention-days: 7
