name: Probe Toutiao browser sorting

on:
  workflow_dispatch:
  push:
    paths:
      - 'probe_browser_sort.py'
      - '.github/workflows/probe-browser-sort.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python probe_browser_sort.py
      - uses: actions/upload-artifact@v4
        with:
          name: browser-sort-probe
          path: output_browser_sort/
          retention-days: 7
