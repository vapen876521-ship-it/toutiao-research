name: Deep category harvester
on:
  push:
    paths:
      - 'harvest_category_deep.py'
      - '.github/workflows/harvest-category-deep.yml'
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - category: hot
            url: https://www.toutiao.com/ch/news_hot/
          - category: finance
            url: https://www.toutiao.com/ch/news_finance/
          - category: ent
            url: https://www.toutiao.com/ch/news_entertainment/
          - category: sports
            url: https://www.toutiao.com/ch/news_sports/
          - category: tech
            url: https://www.toutiao.com/ch/news_tech/
          - category: food
            url: https://www.toutiao.com/ch/news_food/
          - category: travel
            url: https://www.toutiao.com/ch/news_travel/
          - category: game
            url: https://www.toutiao.com/ch/news_game/
          - category: edu
            url: https://www.toutiao.com/ch/news_edu/
          - category: house
            url: https://www.toutiao.com/ch/news_house/
          - category: culture
            url: https://www.toutiao.com/ch/news_culture/
          - category: health
            url: https://www.toutiao.com/ch/news_health/
          - category: history
            url: https://www.toutiao.com/ch/news_history/
          - category: fashion
            url: https://www.toutiao.com/ch/news_fashion/
          - category: baby
            url: https://www.toutiao.com/ch/news_baby/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: |
          CATEGORY_NAME='${{ matrix.category }}' CATEGORY_URL='${{ matrix.url }}' SCROLLS=70 SESSIONS=2 python harvest_category_deep.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: category-deep-${{ matrix.category }}
          path: category_deep_output/
          retention-days: 7
