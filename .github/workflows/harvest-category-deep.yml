name: Deep category harvester
on:
  push:
    paths:
      - 'harvest_category_deep.py'
      - '.github/workflows/harvest-category-deep.yml'
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - category: hot
            url: https://www.toutiao.com/?channel=hot&source=ch
          - category: finance
            url: https://www.toutiao.com/?channel=finance&source=ch
          - category: ent
            url: https://www.toutiao.com/?channel=entertainment&source=ch
          - category: sports
            url: https://www.toutiao.com/?channel=sports&source=ch
          - category: tech
            url: https://www.toutiao.com/?channel=tech&source=ch
          - category: food
            url: https://www.toutiao.com/?channel=food&source=ch
          - category: travel
            url: https://www.toutiao.com/?channel=travel&source=ch
          - category: game
            url: https://www.toutiao.com/?channel=game&source=ch
          - category: health
            url: https://www.toutiao.com/?channel=health&source=ch
          - category: history
            url: https://www.toutiao.com/?channel=history&source=ch
          - category: fashion
            url: https://www.toutiao.com/?channel=fashion&source=ch
          - category: baby
            url: https://www.toutiao.com/?channel=baby&source=ch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: |
          CATEGORY_NAME='${{ matrix.category }}' CATEGORY_URL='${{ matrix.url }}' SCROLLS=55 SESSIONS=2 python harvest_category_deep.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: category-deep-${{ matrix.category }}
          path: category_deep_output/
          retention-days: 7
