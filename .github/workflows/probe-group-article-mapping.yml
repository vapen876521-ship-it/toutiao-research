name: Probe group article mapping
on:
  push:
    paths:
      - 'probe_group_article_mapping.py'
      - '.github/workflows/probe-group-article-mapping.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python probe_group_article_mapping.py
      - uses: actions/upload-artifact@v4
        with:
          name: group-article-mapping
          path: group_mapping_output/
          retention-days: 7
