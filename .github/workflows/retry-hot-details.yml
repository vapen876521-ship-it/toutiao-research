name: Retry hot detail pages
on:
  push:
    paths:
      - 'retry_hot_details.py'
      - '.github/workflows/retry-hot-details.yml'
  workflow_dispatch:

jobs:
  retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python retry_hot_details.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retry-hot-details
          path: retry_hot_output/
          retention-days: 14
