name: Probe Toutiao pagination full HTML

on:
  push:
    paths:
      - 'probe_pagination_fullhtml.py'
      - '.github/workflows/probe-pagination-fullhtml.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Probe full pagination HTML
        run: python probe_pagination_fullhtml.py
      - uses: actions/upload-artifact@v4
        with:
          name: toutiao-pagination-fullhtml
          path: output_pagination_fullhtml/
          retention-days: 7
